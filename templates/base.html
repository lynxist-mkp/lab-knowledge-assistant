<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}福云·文脉助手{% endblock %}</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f4ef;
      --panel: #ffffff;
      --text: #1f2933;
      --muted: #52606d;
      --accent: #0f766e;
      --border: #d9e2ec;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Noto Sans SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
    }
    header h1 {
      margin: 0 0 0.75rem;
      font-size: 1.25rem;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
    }
    nav a {
      color: var(--muted);
      text-decoration: none;
      padding-bottom: 0.15rem;
      border-bottom: 2px solid transparent;
    }
    nav a.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      font-weight: 600;
    }
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      background: #ecfdf5;
      border: 1px solid #99f6e4;
      border-radius: 10px;
      padding: 1rem;
    }
    .stat-card .label {
      color: var(--muted);
      font-size: 0.9rem;
    }
    .stat-card .value {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--accent);
    }
    .muted { color: var(--muted); }
    pre, .chunk-text {
      white-space: pre-wrap;
      word-break: break-word;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
    }
    details {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      margin-bottom: 0.75rem;
      background: var(--panel);
    }
    summary {
      cursor: pointer;
      font-weight: 600;
    }
    ul { padding-left: 1.25rem; }
    button, .link-button {
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      padding: 0;
      font: inherit;
      text-decoration: underline;
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <h1>福云·文脉助手</h1>
    <nav>
      <a href="/" class="{% if active_page == 'overview' %}active{% endif %}">总览</a>
      <a href="/browse" class="{% if active_page == 'browse' %}active{% endif %}">数据浏览</a>
      <a href="/ingestion" class="{% if active_page == 'ingestion' %}active{% endif %}">Ingestion 管理</a>
      <a href="/ingestion/traces" class="{% if active_page == 'ingestion_traces' %}active{% endif %}">Ingestion 追踪</a>
      <a href="/query/traces" class="{% if active_page == 'query_traces' %}active{% endif %}">Query 追踪</a>
      <a href="/eval" class="{% if active_page == 'eval' %}active{% endif %}">评估面板</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
