<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}福云·文脉助手{% endblock %}</title>
  <style>
    {% include "_tokens.css" %}
    .shell-header {
      background: var(--color-panel);
      border-bottom: 1px solid var(--color-border);
      padding: 1rem 1.5rem;
    }
    .shell-header .brand {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--color-primary);
    }
    .shell-header .surface {
      margin: 0.35rem 0 0;
      color: var(--color-muted);
      font-size: 0.95rem;
    }
    .shell-main {
      max-width: 960px;
      margin: 0 auto;
      padding: 1.5rem;
    }
    .shell-panel {
      background: var(--color-panel);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 1.25rem;
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="shell-header">
    <p class="brand">福云·文脉助手</p>
    <p class="surface">{% block surface_label %}{% endblock %}</p>
  </header>
  <main class="shell-main">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
