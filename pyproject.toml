[project]
name = "lab-knowledge-assistant"
version = "0.1.0"
description = "课题组知识助手：课题组公开语料上的模块化 RAG 原型"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.0,<2",
    "jieba",
    "pyyaml",
    "sentence-transformers",
    "langchain-text-splitters",
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart",
    "ragas>=0.4",
    # ragas 0.4.3 的 llms/base.py 顶层 import langchain_community.chat_models.vertexai，
    # 该模块在 langchain-community 0.4 已随退役删除，不钉上限连 import ragas 都会炸。
    "langchain-community<0.4",
    "mcp",
    "httpx",
    "python-dotenv",
    "markitdown[pdf]",
    "pypdfium2",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "reportlab"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
