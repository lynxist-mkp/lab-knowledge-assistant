# 福云·文脉助手 — 配置驱动，切换实现不改调用方

product:
  name: "福云·文脉助手"
  collection: "minpai_culture"

paths:
  chroma: "data/db/chroma"
  bm25: "data/db/bm25"
  ingestion_history: "data/db/ingestion_history.db"
  catalog: "data/db/catalog.json"
  images: "data/images"
  image_index: "data/db/image_index.db"
  traces: "logs/traces.jsonl"
  corpus: "data/corpus"
  prompts: "prompts/qa_v1.txt"

chunking:
  size_chars: 600
  overlap_ratio: 0.15

transform:
  stages: ["refiner", "enricher", "captioner"]  # 未列入的不跑
  refiner: "rule"          # 规则清洗，不打 LLM
  refiner_min_ratio: 0.5   # 有效字符率低于此值的块丢弃
  enricher: "llm"          # 抽 title/summary/tags/文化域
  captioner: "vision"      # 图转文；失败保留 [IMAGE: id] 不阻塞
  domains: ["海丝", "朱子", "妈祖", "船政", "其他"]
  enricher_prompt: "prompts/enrich_v1.txt"
  captioner_prompt: "prompts/caption_v1.txt"

retrieval:
  mode: rrf                 # rrf | dense_only | sparse_only
  dense_k: 20
  sparse_k: 20
  rrf_k: 60                # Elastic 公式 1/(k+rank)，rank 从 1 起
  fused_k: 10
  rerank_top: 5
  rerank_enabled: true     # false = RRF fusion only (rrf ablation)
  rerank_timeout_seconds: 30
  adjacent_n: 1            # ±N same-document neighbors expanded at generation

bm25:
  k1: 1.5
  b: 0.75
  domain_dict: "data/lexicon/domain.txt"
  stopwords: "data/lexicon/stopwords.txt"

providers:
  llm: "mlx_gemma"
  llm_model: "mlx-community/gemma-4-e2b-it-mxfp4"
  vision: "mlx_gemma"
  vision_model: "mlx-community/gemma-4-e2b-it-mxfp4"
  embedding: "bge_m3"
  embedding_model: "BAAI/bge-m3"
  reranker: "cross_encoder"
  reranker_model: "cross-encoder/ms-marco-MiniLM-L6-v2"
  splitter: "recursive_zh"
  vector_store: "chroma"
  evaluator: "ragas_collections"

server:
  host: "127.0.0.1"
  port: 8000
  templates: "templates"

observability:
  trace_file: "logs/traces.jsonl"

evaluation:
  golden_set: "data/eval/golden.jsonl"
  runs: "data/eval/runs"
  ablations: ["dense_only", "sparse_only", "rrf", "rrf_rerank"]
  # Ragas LLM-as-judge（Faithfulness / Context Precision）；密钥只走环境变量
  ragas_judge:
    provider: zhipu

dolphin:
  python: "/Users/linkslinks/project/fjgd/音频清洗/tools/envs/dolphin-env/bin/python"
  script: "/Users/linkslinks/project/fjgd/音频清洗/.trae/skills/audio-process/scripts/dolphin_transcribe.py"
  model: "small.cn"
  lang: "zh"
  region: "MINNAN"

pdf_load:
  mode: "auto"
  chars_per_page_threshold: 100

quality_gate:
  reject_below: 0.60
  approve_above: 0.80

paddleocr:
  python: "/Users/linkslinks/project/fjgd/ragWork/wenmai-assistant/.venvs/paddleocr-env/bin/python"
  script: "/Users/linkslinks/project/fjgd/ragWork/wenmai-assistant/scripts/paddleocr_parse_pdf.py"
  mlx_python: "/Users/linkslinks/project/fjgd/ragWork/wenmai-assistant/.venvs/paddleocr-env/bin/python"
  # ModelScope repo ids — runtime downloads via scripts/resolve_modelscope_model.py (not HuggingFace).
  mlx_model: "mlx-community/PaddleOCR-VL-1.6-5bit"
  mlx_fallback_model: "PaddlePaddle/PaddleOCR-VL-1.6"
  server_port: 8111
  server_url: "http://127.0.0.1:8111/"
  vl_rec_api_model_name: "mlx-community/PaddleOCR-VL-1.6-5bit"
  idle_timeout_seconds: 60

gemma:
  # 本机默认 Gemma：mlx 栈在 minicpm-probe venv（paddleocr-env 的 mlx_vlm 已损坏）
  mlx_python: "/Users/linkslinks/project/fjgd/ragWork/wenmai-assistant/.scratch/minicpm-probe/.venv/bin/python3.12"
  resolve_script: "/Users/linkslinks/project/fjgd/ragWork/wenmai-assistant/scripts/resolve_modelscope_model.py"
  # 已缓存则直接用本地目录；也可改回 ModelScope id 让 resolve_script 解析
  model: "/Users/linkslinks/.cache/modelscope/models/mlx-community--gemma-4-e2b-it-mxfp4/snapshots/master"
  server_port: 8120
  server_url: "http://127.0.0.1:8120/"
  idle_timeout_seconds: 60
